version: 4

output:
    ver-mac/src/dialect.swift:
        type: swift

RootComponent:
    type: component
    oneliners:
        - countText: print(c.countText)
        - countText: RootVM.shared?.countText = c.countText
    shoulds:
        count:
            1. Upon hitting 10 the first time:
                if:
                    c.recentField == F.didClickIncrement &&
                    c.count == 9
                then:
                    c.count += 10
            2. Upon each button click:
                if:
                    c.recentField == F.didClickIncrement
                then:
                    c.count += 1
        countText:
            1. Upon each count change
                if:
                    c.recentField == F.count
                then:
                    c.countText = "Count: '\(c.count)'"
            2. Upon launch
                if:
                    c.recentField == F.didLaunch
                then:
                    c.countText = "Press the button to count"
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true

RootContext:
    type: context
    fields:
        count: Int
        countText: String
        didClickIncrement: Bool
        didLaunch: Bool
        didSetup: Bool
