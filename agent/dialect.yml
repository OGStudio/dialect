version: 4

output:
    ver-mac/src/dialect.swift:
        type: swift

CLIComponent:
    type: component
    oneliners:
        - consoleOutput: print(c.consoleOutput)
        - prompt: llmSet(F.prompt, c.prompt)
    shoulds:
        consoleOutput:
            1. File argument was not found:
                if:
                    c.recentField == F.didLaunch &&
                    cliArgumentValue(c.arguments, CLI_ARG_PROMPT).isEmpty
                then:
                    c.consoleOutput = CLI_CONSOLE_USAGE_AGENT
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        prompt:
            1. Report prompt after launching
                if:
                    c.recentField == F.didLaunch &&
                    !c.inputPrompt.isEmpty
                then:
                    c.prompt = c.inputPrompt

CLIContext:
    type: context
    fields:
        arguments: [String]
        consoleOutput: String
        didLaunch: Bool
        didSetup: Bool
        inputPrompt: String
        prompt: String

LLMComponent:
    type: component
    oneliners:
        - request: print("ИГР LC.request: '\(c.request)'")
    shoulds:
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        request:
            1. See if server is available upon receiving prompt
                if:
                    c.recentField == F.prompt
                then:
                    c.request = llmBuildServerAvailabilityReq(c.serverHost, c.serverPort)

LLMContext:
    type: context
    fields:
        didLaunch: Bool
        didSetup: Bool
        isServerAvailable: Bool
        prompt: String
        request: NetRequest
        response: NetResponse
        serverHost: String
        serverPort: Int
        system: String

NetRequest:
    type: struct
    fields:
        body: String
        headers: [String: String]
        method: String
        url: String

NetResponse:
    type: struct
    fields:
        contents: String
        req: NetRequest
