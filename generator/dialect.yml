version: 4

output:
    ver-mac/src/dialect.swift:
        type: swift

CLIComponent:
    type: component
    oneliners:
        - consoleOutput: print(c.consoleOutput)
        - inputAbsoluteDir: swiftSet(F.inputAbsoluteDir, c.inputAbsoluteDir)
        - inputContents: ymlSet(F.inputContents, c.inputContents)
        - inputFileName: cliResolveAbsoluteDir(c.inputFileName)
        - readFile: cliReadInputFile(c.inputFileName)
    shoulds:
        consoleOutput:
            1. File argument was not found:
                if:
                    c.recentField == F.didLaunch &&
                    cliArgumentValue(c.arguments, CLI_ARG_FILE).isEmpty
                then:
                    c.consoleOutput = CLI_CONSOLE_USAGE
            2. Could not open input file:
                if:
                    c.recentField == F.inputError
                then:
                    c.consoleOutput = CLI_CONSOLE_INPUT_FILE_ERROR
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        inputFileName:
            1. Get file name by parsing aguments:
                if:
                    c.recentField == F.arguments &&
                    cliArgumentValue(c.arguments, CLI_ARG_FILE) != ""
                then:
                    c.inputFileName = cliArgumentValue(c.arguments, CLI_ARG_FILE)
        readFile:
            1. File name has been specified:
                if:
                    c.recentField == F.didLaunch &&
                    !c.inputFileName.isEmpty
                then:
                    c.readFile = true

CLIContext:
    type: context
    fields:
        arguments: [String]
        consoleOutput: String
        didLaunch: Bool
        didSetup: Bool
        inputAbsoluteDir: String
        inputContents: String
        inputError: String
        inputFileName: String
        readFile: Bool

OutputPath:
    type: struct
    fields:
        path: String
        type: String

RootContext:
    type: context
    fields:
        didLaunch: Bool

ShouldBranch:
    type: struct
    fields:
        about: String
        condition: [String]
        reaction: [String]

SwiftComponent:
    type: component
    oneliners:
        - out: otherWriteFile(c.path, c.out)
    shoulds:
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        out:
            1. Upon launch:
                if:
                    c.recentField == F.didLaunch
                then:
                    c.out =
                        otherBase64ToString(SWIFT_EMB64_CORE) +
                        c.outFields +
                        c.outStructs +
                        c.outContexts +
                        c.outSets +
                        c.outShoulds +
                        c.outRegisterShoulds
        outContexts:
            1. When entity field types are available:
                if:
                    c.recentField == F.entityFieldTypes
                then:
                    c.outContexts = swiftContexts(c.entities, c.entityTypes, c.entityFields, c.entityFieldTypes)
        outFields:
            1. When entity fields are available:
                if:
                    c.recentField == F.entityFields
                then:
                    c.outFields = swiftFields(c.entityFields)
        outRegisterShoulds:
            1. When shoulds are ready:
                if:
                    c.recentField == F.entityShoulds
                then:
                    c.outRegisterShoulds = swiftRegisterShoulds(c.entities, c.entityShoulds)
        outSets:
            1. When entities are ready:
                if:
                    c.recentField == F.entities
                then:
                    c.outSets = swiftSets(c.entities)
        outShoulds:
            1. When entity should branches are available:
                if:
                    c.recentField == F.entityShouldBranches
                then:
                    c.outShoulds = swiftShoulds(c.entities, c.entityShoulds, c.entityShouldBranches)
        outStructs:
            1. When entity field types are available:
                if:
                    c.recentField == F.entityFieldTypes
                then:
                    c.outStructs = swiftStructs(c.entities, c.entityTypes, c.entityFields, c.entityFieldTypes)
        path:
            1. Extract Swift path if present:
                if:
                    c.recentField == F.outputPaths &&
                    c.outputPaths.contains(where: { $0.type == SWIFT_TYPE })
                then:
                    let last = c.outputPaths.first { $0.type == SWIFT_TYPE }?.path ?? "N/A"
                    c.path = c.inputAbsoluteDir + "/" + last

SwiftContext:
    type: context
    fields:
        didLaunch: Bool
        didSetup: Bool
        entities: [String]
        entityFields: [Int: [String]]
        entityFieldTypes: [Int: [Int: String]]
        entityShouldBranches: [Int: [Int: [ShouldBranch]]]
        entityShoulds: [Int: [String]]
        entityTypes: [Int: String]
        inputAbsoluteDir: String
        path: String
        out: String
        outContexts: String
        outFields: String
        outputPaths: [OutputPath]
        outRegisterShoulds: String
        outSets: String
        outShoulds: String
        outStructs: String

YMLComponent:
    type: component
    oneliners:
        - entities: swiftSet(F.entities, c.entities)
        - entityFields: swiftSet(F.entityFields, c.entityFields)
        - entityFieldTypes: swiftSet(F.entityFieldTypes, c.entityFieldTypes)
        - entityShouldBranches: swiftSet(F.entityShouldBranches, c.entityShouldBranches)
        - entityShoulds: swiftSet(F.entityShoulds, c.entityShoulds)
        - entityTypes: swiftSet(F.entityTypes, c.entityTypes)
        - outputPaths: swiftSet(F.outputPaths, c.outputPaths)
        - parseInput: ymlReadLines(c.inputContents)
    shoulds:
        chunks:
            1. Split input lines into chunks:
                if:
                    c.recentField == F.inputLines
                then:
                    c.chunks = ymlParseChunks(c.inputLines)
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        entities:
            1. When chunks are ready:
                if:
                    c.recentField == F.chunks
                then:
                    c.entities = ymlParseEntities(c.chunks)
        entityFields:
            1. Upon entities:
                if:
                    c.recentField == F.entities
                then:
                    c.entityFields = ymlParseEntityFields(c.chunks, c.entities)
        entityFieldTypes:
            1. Upon entity fields:
                if:
                    c.recentField == F.entityFields
                then:
                    c.entityFieldTypes = ymlParseEntityFieldTypes(c.chunks, c.entities, c.entityFields)
        entityShouldBranches:
            1. Upon entity shoulds:
                if:
                    c.recentField == F.entityShoulds
                then:
                    c.entityShouldBranches = ymlParseEntityShouldBranches(c.chunks, c.entities, c.entityShoulds)
        entityShoulds:
            1. Upon entities:
                if:
                    c.recentField == F.entities
                then:
                    c.entityShoulds = ymlParseEntityShoulds(c.chunks, c.entities)
        entityTypes:
            1. Upon entities:
                if:
                    c.recentField == F.entities
                then:
                    c.entityTypes = ymlParseEntityTypes(c.chunks, c.entities)
        outputPaths:
            1. When chunks are ready:
                if:
                    c.recentField == F.chunks
                then:
                    c.outputPaths = ymlParseOutputPaths(c.chunks)
        parseInput:
            1. Upon launching:
                if:
                    c.recentField == F.didLaunch &&
                    !c.inputContents.isEmpty
                then:
                    c.parseInput = true
        version:
            1. When chunks are ready:
                if:
                    c.recentField == F.chunks
                then:
                    c.version = ymlParseVersion(c.chunks)

YMLContext:
    type: context
    fields:
        chunks: [String: [String]]
        didLaunch: Bool
        didSetup: Bool
        entities: [String]
        entityFields: [Int: [String]]
        entityFieldTypes: [Int: [Int: String]]
        entityShouldBranches: [Int: [Int: [ShouldBranch]]]
        entityShoulds: [Int: [String]]
        entityTypes: [Int: String]
        inputContents: String
        inputLines: [String]
        outputPaths: [OutputPath]
        parseInput: Bool
        version: Int
