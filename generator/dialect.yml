version: 4

output:
    ver-mac/src/dialect.swift:
        type: swift

CLIComponent:
    type: component
    oneliners:
        - consoleOutput: print(c.consoleOutput)
        - inputAbsoluteDir: kotlinSet(F.inputAbsoluteDir, c.inputAbsoluteDir)
        - inputAbsoluteDir: swiftSet(F.inputAbsoluteDir, c.inputAbsoluteDir)
        - inputContents: ymlSet(F.inputContents, c.inputContents)
        - inputFileName: cliResolveAbsoluteDir(c.inputFileName, F.inputAbsoluteDir)
        - readFile: cliReadInputFile(c.inputFileName, F.inputContents, F.inputError)
    shoulds:
        consoleOutput:
            1. File argument was not found:
                if:
                    c.recentField == F.didLaunch &&
                    cliArgumentValue(c.arguments, CLI_ARG_FILE).isEmpty
                then:
                    c.consoleOutput = CLI_CONSOLE_USAGE
            2. Could not open input file:
                if:
                    c.recentField == F.inputError
                then:
                    c.consoleOutput = CLI_CONSOLE_INPUT_FILE_ERROR
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        inputFileName:
            1. Get file name by parsing aguments:
                if:
                    c.recentField == F.arguments &&
                    cliArgumentValue(c.arguments, CLI_ARG_FILE) != ""
                then:
                    c.inputFileName = cliArgumentValue(c.arguments, CLI_ARG_FILE)
        readFile:
            1. File name has been specified:
                if:
                    c.recentField == F.didLaunch &&
                    !c.inputFileName.isEmpty
                then:
                    c.readFile = true

CLIContext:
    type: context
    fields:
        arguments: [String]
        consoleOutput: String
        didLaunch: Bool
        didSetup: Bool
        inputAbsoluteDir: String
        inputContents: String
        inputError: String
        inputFileName: String
        readFile: Bool

ConvComponent:
    type: component
    oneliners:
        - prompt: llmSet(F.prompt, c.prompt)
    shoulds:
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        prompt:
            1. Upon reading input file contents:
                if:
                    c.recentField == F.inputContents
                then:
                    c.prompt = CONV_PROMPT_PREFIX + c.inputContents + CONV_PROMPT_SUFFIX

ConvContext:
    type: context
    fields:
        didLaunch: Bool
        didSetup: Bool
        entities: [String]
        entityShouldBranches: [Int: [Int: [ShouldBranch]]]
        entityShoulds: [Int: [String]]
        inputContents: String
        prompt: String
        reply: String
        transpiledShouldBranches: [Int: [Int: [ShouldBranch]]]

KotlinComponent:
    type: component
    oneliners:
        - out: otherWriteFile(c.path, c.out)
    shoulds:
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        out:
            1. Upon transpilations:
                if:
                    c.recentField == F.outTranspilations
                then:
                    c.out =
                        KOTLIN_OGS_PKG +
                        "\n" +
                        otherBase64ToString(KOTLIN_EMB64_CORE)
                            .replacingOccurrences(of: KOTLIN_OGS_PKG, with: "") +
                        c.outFields +
                        c.outStructs +
                        c.outContexts +
                        c.outSets +
                        c.outShoulds +
                        c.outRegisterShoulds +
                        c.outRegisterEffects
        outContexts:
            1. When entity field types are available:
                if:
                    c.recentField == F.entityFieldTypes
                then:
                    c.outContexts = kotlinContexts(c.entities, c.entityTypes, c.entityFields, c.entityFieldTypes)
        outFields:
            1. When entity fields are available:
                if:
                    c.recentField == F.entityFields
                then:
                    c.outFields = kotlinFields(c.entityFields)
        outSets:
            1. When entities are ready:
                if:
                    c.recentField == F.entities
                then:
                    c.outSets = kotlinSets(c.entities)
        outStructs:
            1. When entity field types are available:
                if:
                    c.recentField == F.entityFieldTypes
                then:
                    c.outStructs = kotlinStructs(c.entities, c.entityTypes, c.entityFields, c.entityFieldTypes)
        outRegisterEffects:
            1. When oneliners are ready:
                if:
                    c.recentField == F.entityOneliners
                then:
                    c.outRegisterEffects = kotlinRegisterEffects(c.entities, c.entityOneliners)
        outRegisterShoulds:
            1. When shoulds are ready:
                if:
                    c.recentField == F.entityShoulds
                then:
                    c.outRegisterShoulds = kotlinRegisterShoulds(c.entities, c.entityShoulds)
        outShoulds:
            1. When entity should branches are available:
                if:
                    c.recentField == F.entityShouldBranches
                then:
                    c.outShoulds = kotlinShoulds(c.entities, c.entityShoulds, c.entityShouldBranches)
        path:
            1. Extract Kotlin path if present:
                if:
                    c.recentField == F.outputPaths &&
                    c.outputPaths.contains(where: { $0.type == KOTLIN_TYPE })
                then:
                    let last = c.outputPaths.first { $0.type == KOTLIN_TYPE }?.path ?? "N/A"
                    c.path = c.inputAbsoluteDir + "/" + last

KotlinContext:
    type: context
    fields:
        didLaunch: Bool
        didSetup: Bool
        entities: [String]
        entityFields: [Int: [String]]
        entityFieldTypes: [Int: [Int: String]]
        entityOneliners: [Int: [Oneliner]]
        entityShouldBranches: [Int: [Int: [ShouldBranch]]]
        entityShoulds: [Int: [String]]
        entityTypes: [Int: String]
        inputAbsoluteDir: String
        path: String
        out: String
        outContexts: String
        outFields: String
        outputPaths: [OutputPath]
        outRegisterEffects: String
        outRegisterShoulds: String
        outSets: String
        outShoulds: String
        outStructs: String
        outTranspilations: String
        transpiledShouldBranches: [Int: [Int: [ShouldBranch]]]

LLMComponent:
    type: component
    oneliners:
        - request: llmLoad(c.request, F.response, F.responseError)
    shoulds:
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        reply:
            1. Upon successful response:
                if:
                    c.recentField == F.response
                then:
                    c.reply = llmExtractReply(c.response.contents)
            2. Upon error response:
                if:
                    c.recentField == F.responseError
                then:
                    c.reply = c.responseError.contents
        request:
            1. See if server is available upon receiving prompt
                if:
                    c.recentField == F.prompt
                then:
                    c.request = llmReqPrompt(LLM_DEFAULT_HOST, LLM_DEFAULT_PORT, c.prompt)

LLMContext:
    type: context
    fields:
        didLaunch: Bool
        didSetup: Bool
        prompt: String
        reply: String
        request: NetRequest
        response: NetResponse
        responseError: NetResponse
        system: String

NetRequest:
    type: struct
    fields:
        body: String
        headers: [String: String]
        method: String
        url: String

NetResponse:
    type: struct
    fields:
        contents: String
        req: NetRequest

Oneliner:
    type: struct
    fields:
        field: String
        reaction: String

OutputPath:
    type: struct
    fields:
        path: String
        type: String

ShouldBranch:
    type: struct
    fields:
        about: String
        condition: [String]
        reaction: [String]

