version: 4

CLIContext:
    type: context
    fields:
        arguments: [String]
        didLaunch: Bool
        didSetup: Bool
        input: String
        inputFileName: String
        inputFileNameContents: String
        readFile: Bool
        stdin: String

CLIComponent:
    activeShoulds:
        - didLaunch
        - input
        - inputFileName
        - readFile
    shoulds:
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        input:
            1. File name contents arrived:
                if:
                    c.recentField == F.inputFileNameContents
                then:
                    c.input = c.inputFileNameContents
            2. Stdin contents arrived:
                if:
                    c.recentField == F.stdin
                then:
                    c.input = c.stdin
        inputFileName:
            1. Get file name by parsing aguments
              if:
                  c.recentField == F.arguments &&
                  cliArgumentValue(c.arguments, CLI_ARG_FILE) != ""
              then:
                  c.inputFileName = cliArgumentValue(c.arguments, CLI_ARG_FILE)
        readFile:
            1. File name has been specified:
                if:
                    c.recentField == F.inputFileName
                then:
                    c.readFile = true

DialectContext:
    type: context
    fields:
      input: String

RootContext:
    type: context
    fields:
        didLaunch: Bool
