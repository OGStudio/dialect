version: 4

output:
    ver-mac/src/dialect.swift:
        type: swift

ConvComponent:
    type: component

ConvContext:
    type: context
    fields:
        didLaunch: Bool
        didSetup: Bool

TranspilerComponent:
    type: component
    oneliners:
        - consoleOutput: print(c.consoleOutput)
        - willShutdown: transpilerShutdown()
    shoulds:
        consoleOutput:
            1. Upon reply:
                if:
                    c.recentField == F.reply
                then:
                    c.consoleOutput = c.reply
        willShutdown:
            1. Upon reply:
                if:
                    c.recentField == F.reply
                then:
                    c.willShutdown = true
            2. Upon CLI console output
                if:
                    c.recentField == F.cliDidConsoleOutput
                then:
                    c.willShutdown = true

TranspilerContext:
    type: context
    fields:
        cliDidConsoleOutput: Bool
        consoleOutput: String
        reply: String
        willShutdown: Bool

CLIComponent:
    type: component
    oneliners:
        - consoleOutput: print(c.consoleOutput)
        - consoleOutput: transpilerSet(F.cliDidConsoleOutput, true)
    shoulds:
        consoleOutput:
            1. File argument was not found:
                if:
                    c.recentField == F.didLaunch &&
                    cliArgumentValue(c.arguments, CLI_ARG_FILE).isEmpty
                then:
                    c.consoleOutput = CLI_CONSOLE_USAGE_TRANSPILER
            2. Could not open input file:
                if:
                    c.recentField == F.inputError
                then:
                    c.consoleOutput = CLI_CONSOLE_INPUT_FILE_ERROR
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        inputFileName:
            1. Get file name by parsing aguments:
                if:
                    c.recentField == F.arguments &&
                    cliArgumentValue(c.arguments, CLI_ARG_FILE) != ""
                then:
                    c.inputFileName = cliArgumentValue(c.arguments, CLI_ARG_FILE)
        willReadFile:
            1. File name has been specified:
                if:
                    c.recentField == F.didLaunch &&
                    !c.inputFileName.isEmpty
                then:
                    c.willReadFile = true

CLIContext:
    type: context
    fields:
        arguments: [String]
        consoleOutput: String
        didLaunch: Bool
        didSetup: Bool
        inputError: String
        inputFileName: String
        willReadFile: Bool

LLMComponent:
    type: component
    oneliners:
        - request: llmLoad(c.request, F.response, F.responseError)
    shoulds:
        didLaunch:
            1. Only once during the first setup:
                if:
                    c.recentField == F.didSetup &&
                    c.didLaunch == false
                then:
                    c.didLaunch = true
        reply:
            1. Upon successful response:
                if:
                    c.recentField == F.response
                then:
                    c.reply = llmExtractReply(c.response.contents)
            2. Upon error response:
                if:
                    c.recentField == F.responseError
                then:
                    c.reply = c.responseError.contents
        request:
            1. See if server is available upon receiving prompt
                if:
                    c.recentField == F.prompt
                then:
                    c.request = llmReqPrompt(LLM_DEFAULT_HOST, LLM_DEFAULT_PORT, c.prompt)

LLMContext:
    type: context
    fields:
        didLaunch: Bool
        didSetup: Bool
        prompt: String
        reply: String
        request: NetRequest
        response: NetResponse
        responseError: NetResponse
        system: String

NetRequest:
    type: struct
    fields:
        body: String
        headers: [String: String]
        method: String
        url: String

NetResponse:
    type: struct
    fields:
        contents: String
        req: NetRequest
